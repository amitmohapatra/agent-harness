<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trellis inbox</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d8dc; --bg: #fafafa; --card: #fff; --accent: #2557d6; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececef; --muted: #a0a0a8; --line: #3a3a40; --bg: #18181b; --card: #222226; --accent: #7aa2ff; }
  }
  body { margin: 0; padding: 16px; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .question { font-weight: 600; margin-bottom: 10px; }
  label { display: block; margin: 6px 0; }
  .hint { color: var(--muted); font-size: 13px; }
  input[type=text], input[type=number], textarea, select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  textarea { min-height: 70px; font-family: ui-monospace, monospace; }
  pre { overflow-x: auto; background: var(--bg); padding: 8px; border-radius: 6px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; overflow-x: auto; display: block; }
  td, th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .error { color: #c62828; margin-top: 6px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Waiting for a person</h1>
    <input id="assignee" type="text" placeholder="assignee (user:…, role:…)" style="max-width: 260px">
    <button id="reload">Reload</button>
  </header>
  <div id="runs"></div>
</main>
<script>
"use strict";
// The reference inbox: lists paused runs and answers them through the JSON routes beside
// this page. Your own screens: window.trellisComponents = {name: (element, props, interrupt,
// submit) => ...}, used for a question whose interrupt names that component.
const base = location.pathname.replace(/\/$/, "");
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) if (child) node.append(child);
  return node;
};
const json = (value) => el("pre", { text: JSON.stringify(value, null, 2) });

async function load() {
  const list = document.getElementById("runs");
  const assignee = document.getElementById("assignee").value.trim();
  const query = assignee ? `?assignee=${encodeURIComponent(assignee)}` : "";
  const response = await fetch(`${base}/runs${query}`);
  list.replaceChildren();
  if (!response.ok) { list.append(el("p", { class: "error", text: `${response.status}: ${await response.text()}` })); return; }
  const runs = await response.json();
  if (!runs.length) list.append(el("p", { class: "empty", text: "Nothing is waiting." }));
  for (const run of runs) list.append(card(run));
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

function card(run) {
  const interrupt = run.interrupt;
  const node = el("section", { class: "card", id: interrupt.interrupt_id });
  const error = el("div", { class: "error" });
  const comment = el("input", { type: "text", placeholder: "comment (optional)" });
  const submit = async (decision, answer, remember = "once") => {
    const body = { interrupt_id: interrupt.interrupt_id, decision, answer, comment: comment.value || null, remember };
    const response = await fetch(`${base}/runs/${encodeURIComponent(run.run_id)}/resume`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (response.ok) node.replaceChildren(el("p", { class: "hint", text: `Answered: ${decision.toLowerCase()}.` }));
    else error.textContent = (await response.json()).detail;
  };
  node.append(
    el("div", { class: "meta", text: `${run.agent_id} · ${run.run_id} · for ${run.assignee || "anyone"}${interrupt.deadline ? " · due " + interrupt.deadline : ""}` }),
    el("div", { class: "question", text: interrupt.question }),
  );
  const own = interrupt.component && (window.trellisComponents || {})[interrupt.component];
  const body = el("div");
  if (own) own(body, interrupt.props || {}, interrupt, submit);
  else body.append(control(interrupt, submit));
  node.append(body, comment, error);
  return node;
}

function control(interrupt, submit) {
  const box = el("div");
  const payload = interrupt.payload || {};
  if (payload.table) box.append(table(payload.table));
  if (payload.diff) box.append(el("div", { class: "hint", text: "Before" }), json(payload.diff.before), el("div", { class: "hint", text: "After" }), json(payload.diff.after));
  if (interrupt.payload_ref) box.append(el("div", { class: "hint", text: `Data: artifact ${interrupt.payload_ref.artifact_id}` }));
  if (interrupt.tool_call) box.append(el("div", { class: "hint", text: `Call: ${interrupt.tool_call.tool}` }));
  const actions = el("div", { class: "actions" });
  if (interrupt.reason === "APPROVAL") {
    const args = el("textarea", {});
    args.value = JSON.stringify(interrupt.tool_call.args, null, 2);
    const remember = el("input", { type: "checkbox" });
    box.append(args, el("label", {}, remember, ` approve ${interrupt.tool_call.tool} for the rest of this run`));
    actions.append(
      el("button", { class: "primary", text: "Approve", onclick: () => submit("APPROVE", null, remember.checked ? "run" : "once") }),
      el("button", { text: "Approve edited", onclick: () => submit("EDIT", JSON.parse(args.value)) }),
      el("button", { text: "Reject", onclick: () => submit("REJECT", null) }),
    );
  } else if ((interrupt.options || []).length) {
    const kind = interrupt.multiple ? "checkbox" : "radio";
    const inputs = interrupt.options.map((option) => {
      const o = typeof option === "string" ? { value: option } : option;
      const input = el("input", { type: kind, name: interrupt.interrupt_id, value: o.value });
      box.append(el("label", {}, input, ` ${o.label || o.value}`, o.description ? el("div", { class: "hint", text: o.description }) : null));
      return input;
    });
    actions.append(el("button", { class: "primary", text: "Answer", onclick: () => {
      const picked = inputs.filter((i) => i.checked).map((i) => i.value);
      submit("ANSWER", interrupt.multiple ? picked : picked[0]);
    } }));
  } else {
    const read = form(box, interrupt.expects, interrupt.ui_schema || {});
    const review = interrupt.reason === "REVIEW";
    actions.append(el("button", { class: "primary", text: review ? "Save correction" : "Answer", onclick: () => submit(review ? "EDIT" : "ANSWER", read()) }));
  }
  actions.append(el("button", { text: "Cancel run", onclick: () => submit("CANCEL", null) }));
  box.append(actions);
  return box;
}

// A form for a JSON Schema: an object's properties as fields (strings, numbers, booleans,
// enums, arrays of enums), ui_schema's ui:widget/ui:title/ui:help/ui:placeholder/ui:order;
// anything else as JSON in a text box. Returns the reader of the answer.
function form(box, schema, ui) {
  if (!schema || schema.type !== "object" || !schema.properties) return field(box, schema || {}, ui, schema && schema.title);
  const readers = {};
  const order = ui["ui:order"] || Object.keys(schema.properties);
  for (const name of order.filter((n) => n in schema.properties)) {
    readers[name] = field(box, schema.properties[name], ui[name] || {}, name);
  }
  return () => Object.fromEntries(Object.entries(readers).map(([k, read]) => [k, read()]).filter(([, v]) => v !== undefined));
}

function field(box, schema, ui, name) {
  const title = ui["ui:title"] || schema.title || name || "Answer";
  const label = el("label", { text: title });
  let input, read;
  const options = schema.enum || (schema.items && schema.items.enum);
  if (schema.type === "boolean") {
    input = el("input", { type: "checkbox" });
    read = () => input.checked;
  } else if (options) {
    input = el("select", schema.type === "array" ? { multiple: "" } : {});
    for (const value of options) input.append(el("option", { value, text: String(value) }));
    read = () => schema.type === "array" ? [...input.selectedOptions].map((o) => o.value) : input.value;
  } else if (schema.type === "number" || schema.type === "integer") {
    input = el("input", { type: "number", step: schema.type === "integer" ? "1" : "any" });
    read = () => input.value === "" ? undefined : Number(input.value);
  } else if (schema.type === "string") {
    input = ui["ui:widget"] === "textarea" ? el("textarea") : el("input", { type: ui["ui:widget"] === "password" ? "password" : "text" });
    read = () => input.value === "" ? undefined : input.value;
  } else {
    input = el("textarea");
    read = () => { try { return JSON.parse(input.value); } catch { return input.value; } };
  }
  if (ui["ui:placeholder"]) input.setAttribute("placeholder", ui["ui:placeholder"]);
  label.append(input);
  if (ui["ui:help"] || schema.description) label.append(el("div", { class: "hint", text: ui["ui:help"] || schema.description }));
  box.append(label);
  return read;
}

function table(rows) {
  const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))];
  return el("table", {},
    el("tr", {}, ...columns.map((c) => el("th", { text: c }))),
    ...rows.map((row) => el("tr", {}, ...columns.map((c) => el("td", { text: row[c] === undefined ? "" : String(row[c]) })))));
}

document.getElementById("reload").addEventListener("click", load);
document.getElementById("assignee").addEventListener("change", load);
load();
</script>
</body>
</html>

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run of the commit it replaced: only the head's
# result can merge it. A run on main is never cancelled (one group per commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # every gate on each Python the harness supports (requires-python >=3.12)
    name: gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      KIMI_DISABLE_TELEMETRY: "1"
      KIMI_CODE_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        working-directory: agent-harness
    steps:
      # The platform is unpublished: the harness resolves its siblings by path (pyproject
      # [tool.uv.sources] ../agent-contracts, ../bifrost-sdk,
      # ../agent-memory-service/sdk/python, ../agent-runs/sdk/python), so they are checked out
      # next to it, on main.
      - uses: actions/checkout@v4
        with:
          path: agent-harness
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-contracts
          path: agent-contracts
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/bifrost-sdk
          path: bifrost-sdk
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-memory-service
          path: agent-memory-service
      # trellis-runs (sdk/python) is a dependency, and its committed docs/openapi.json is what
      # tests/contract checks the harness's run store against (as
      # agent-memory-service/docs/openapi.json is for the memory fake)
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-runs
          path: agent-runs
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: agent-harness/uv.lock
      - name: Install
        run: uv sync --all-extras
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Kimi Code, the program kimi() drives over ACP: the version compat.BINARIES pins, in a
      # prefix of its own, cached. The Kimi tests run it (tests/integration/test_kimi.py, the
      # matrix's Kimi column), its model a planned endpoint on the runner: no Moonshot key.
      - uses: actions/cache@v4
        with:
          path: ~/.kimi-code-npm
          key: kimi-code-2.1.1-node22-${{ runner.os }}
      - name: Install Kimi Code
        run: |
          [ -x ~/.kimi-code-npm/bin/kimi ] || npm install -g --prefix ~/.kimi-code-npm @moonshot-ai/kimi-code@2.1.1
          echo "$HOME/.kimi-code-npm/bin" >> "$GITHUB_PATH"
          ~/.kimi-code-npm/bin/kimi --version
      - name: Lint
        run: make lint
      - name: Typecheck
        # pyright reads trellis.contracts / trellis.memory / trellis.runs through the links
        # `make typings` makes
        run: make typings typecheck
      - name: Tests
        # every test except the benchmark and the live ones (they need running services)
        run: make test
      - name: Examples
        # every example and the README walkthrough, offline (scripted model, memory service
        # and gateway), in parallel
        run: make examples
      - name: Docs check
        # every relative link and anchor resolves; every snippet parses and names the real API
        run: make docs-check
      - name: Mermaid diagrams
        # every ```mermaid block parses, with the same mermaid GitHub renders (11.x)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/mermaid" mermaid@11 jsdom@25
          MERMAID_MODULES="$RUNNER_TEMP/mermaid/node_modules" make docs-mermaid
      - name: Feature matrix
        # every feature x adapter x way x mode x selection, scripted (tests/matrix), in shards
        # at once; build/matrix.md is the matrix as it ran
        run: make matrix
      - name: Feature matrix, model names
        # the ReAct cells again with a model name: served by Bifrost (gateway on) and by an
        # OpenAI-compatible endpoint (gateway off) — with the model objects above, all three modes
        run: make matrix-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-py${{ matrix.python-version }}
          path: |
            agent-harness/build/matrix.md
            agent-harness/build/matrix-*.xml
          if-no-files-found: ignore
      - name: Overhead benchmark
        # fails when the harness's own overhead doubles against benchmark-results.json
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: agent-harness/build/benchmark-results.json
          if-no-files-found: ignore

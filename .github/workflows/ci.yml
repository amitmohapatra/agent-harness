name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-harness
    steps:
      # The platform is unpublished: the harness resolves its siblings by path (pyproject
      # [tool.uv.sources] ../agent-contracts, ../bifrost-sdk,
      # ../agent-memory-service/sdk/python), so they are checked out next to it, on main.
      - uses: actions/checkout@v4
        with:
          path: agent-harness
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-contracts
          path: agent-contracts
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/bifrost-sdk
          path: bifrost-sdk
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-memory-service
          path: agent-memory-service
      # not a dependency: its committed docs/openapi.json is what tests/contract checks the
      # runs client against (as agent-memory-service/docs/openapi.json is for the memory fake)
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-runs
          path: agent-runs
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent-harness/uv.lock
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: make lint
      - name: Typecheck
        # pyright reads trellis.contracts / trellis.memory through the links `make typings` makes
        run: make typings typecheck
      - name: Tests
        # every test except the benchmark and the live ones (they need running services)
        run: make test
      - name: Examples
        run: make examples
      - name: Overhead benchmark
        # fails when the harness's own overhead doubles against benchmark-results.json
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: agent-harness/build/benchmark-results.json
          if-no-files-found: ignore

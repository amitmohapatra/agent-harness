name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The platform is unpublished: the harness resolves its siblings by path (pyproject
      # [tool.uv.sources]), so they are checked out next to it.
      - uses: actions/checkout@v4
        with:
          path: agent-harness
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-contracts
          path: agent-contracts
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/bifrost-sdk
          path: bifrost-sdk
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-memory-service
          path: agent-memory-service
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: agent-harness
        run: uv sync
      - name: Lint
        working-directory: agent-harness
        run: make lint
      - name: Typecheck
        working-directory: agent-harness
        run: make typecheck
      - name: Tests
        working-directory: agent-harness
        run: make test
      - name: Examples
        working-directory: agent-harness
        run: make examples
      - name: Overhead benchmark
        working-directory: agent-harness
        # fails when the harness's own overhead doubles against benchmark-results.json
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: agent-harness/build/benchmark-results.json

[project]
name = "trellis-harness"
version = "0.4.0"
description = "Attach memory, tools, approvals, durable runs and tracing to an agent you already built."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Platform Team" }]
keywords = ["agents", "harness", "langgraph", "openai-agents", "claude-agent-sdk", "memory"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

# The core imports no agent framework: each adapter imports its framework lazily, the first
# time a target of that type is wrapped. The extras only decide what gets installed.
dependencies = [
  "trellis-contracts>=0.4",
  "trellis-memory>=0.4",
  "bifrost-sdk>=0.2",
  "pydantic>=2.13,<3",
  "httpx>=0.28",
  "croniter>=6",
  "opentelemetry-api>=1.44",
]

[project.optional-dependencies]
# `create_agent` and its middleware (HumanInTheLoopMiddleware, TodoListMiddleware) are
# the `langchain` package: LangChain v1 agents are LangGraph graphs.
langgraph = ["langgraph>=1.2,<2", "langchain-core>=1.6,<2", "langchain>=1.4,<2"]
deepagents = ["trellis-harness[langgraph]", "deepagents>=0.7.19,<0.8"]
openai-agents = ["openai-agents>=0.22.3,<0.23"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.160,<0.3"]
agui = ["fastapi>=0.115"]
a2a = ["a2a-sdk[http-server]>=1.1,<2", "fastapi>=0.115"]
# OTLP export (Langfuse is reached through the same exporter; no Langfuse SDK).
otel = ["opentelemetry-sdk>=1.44", "opentelemetry-exporter-otlp-proto-http>=1.44"]
all = [
  "trellis-harness[langgraph,deepagents,openai-agents,claude-agent-sdk,agui,a2a,otel]",
]

[dependency-groups]
dev = [
  "trellis-harness[all]",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.3",
  "respx>=0.22",
  # tests/contract: the siblings' OpenAPI documents (3.1: JSON Schema 2020-12) check the wire
  "jsonschema>=4.23",
  "ruff>=0.16",
  "pyright>=1.1.414",
  "uvicorn>=0.30",
  # Examples point LangGraph at Bifrost's OpenAI-compatible endpoint with this.
  "langchain-openai>=1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``trellis/__init__.py`` extends ``__path__`` (pkgutil style), so trellis.contracts and
# trellis.memory, installed from their own distributions, stay importable beside it.
packages = ["src/trellis"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Sibling checkouts on their ``overhaul`` branches, while the platform is unpublished.
trellis-contracts = { path = "../agent-contracts", editable = true }
trellis-memory = { path = "../agent-memory-service/sdk/python", editable = true }
bifrost-sdk = { path = "../bifrost-sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
filterwarnings = ["error::DeprecationWarning:trellis.*"]
markers = [
  "live: needs running services (BIFROST_URL / MEMORY_URL / RUNS_URL); skipped otherwise",
  "performance: harness overhead benchmark (writes build/benchmark-results.json)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC", "T20"]
ignore = ["PLR0913", "PLR2004", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["trellis"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "T20", "PLC0415", "E501", "PLR0915"]
"examples/**" = ["T20", "PLC0415"]
# Adapters import their framework on first use, never at module import.
"src/trellis/harness/adapters/**" = ["PLC0415"]
"src/trellis/harness/tools/convert/**" = ["PLC0415"]
"src/trellis/harness/surfaces/**" = ["PLC0415"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
exclude = ["**/__pycache__", "**/.venv", ".claude"]
typeCheckingMode = "standard"
# ``trellis`` is a pkgutil-style package (it extends ``__path__``) and pyright does not follow
# that for editable installs: ``make typings`` links trellis.contracts and trellis.memory
# where pyright looks first.
stubPath = "typings"

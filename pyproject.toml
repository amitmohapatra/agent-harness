[project]
name = "trellis-harness"
version = "0.3.0"
description = "Framework-neutral runtime harness for agents: context, memory, telemetry, tools, models, policy and evaluation around agents you already have."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Platform Team" }]
keywords = ["agents", "harness", "opentelemetry", "langfuse", "memory", "langgraph", "deepagents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

# Core stays small: contracts, config, the OTel API (not the SDK) and the Memory Service SDK.
# No framework (langgraph/crewai/adk) and no telemetry backend are ever pulled in here.
dependencies = [
  "trellis-contracts>=0.2",
  # The gateway client, shared with the memory service so its retry and rate-limit
  # handling has one implementation rather than two that drift.
  "bifrost-sdk>=0.1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "opentelemetry-api>=1.44",
  "trellis-memory>=0.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
# OpenTelemetry SDK + OTLP exporter (needed only if the application does not configure its own)
otel = ["opentelemetry-sdk>=1.44", "opentelemetry-exporter-otlp-proto-http>=1.44"]
# AI Registry binding: validating a result against the output_schema an agent declared
registry = ["jsonschema>=4"]
# Langfuse observability / evaluation / prompt provider
langfuse = ["langfuse>=3.0"]
# LangGraph adapter (never installed for plain-Python users)
langgraph = ["trellis-harness-langgraph"]
# AG-UI surface (FastAPI + SSE); the core imports nothing of it
agui = ["trellis-harness-agui"]
# Framework adapters, one distribution each (design §8). The core imports none of them.
deepagents = ["trellis-harness-deepagents"]
openai-agents = ["trellis-harness-openai-agents"]
claude-agent-sdk = ["trellis-harness-claude-agent-sdk"]
# A2A surface and client (a2a-sdk): serve agents to agents, call registry agents as tools
a2a = ["trellis-harness-a2a"]
# JSON structured logging via structlog (stdlib logging is used when absent)
logging = ["structlog>=25.2"]
all = [
  "trellis-harness[otel,langfuse,langgraph,logging,registry,agui,a2a,deepagents,openai-agents,claude-agent-sdk]",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=6",
  "pytest-timeout>=2.3",
  "hypothesis>=6",
  "respx>=0.22",
  "ruff>=0.16",
  "pyright>=1.1.414",
  "opentelemetry-sdk>=1.44",
  "structlog>=25.2",
  "langgraph>=1.2",
  "trellis-harness-langgraph",
  "trellis-harness-agui",
  "trellis-harness-a2a",
  "fastapi>=0.115",
  # The three frameworks the Phase 5 adapters bind, pinned to the ranges their tests
  # verify. Declared here as well as in each adapter so a dev sync always has them.
  "deepagents>=0.7.19,<0.8",
  "openai-agents>=0.22.3,<0.23",
  "claude-agent-sdk>=0.2.160,<0.3",
  "trellis-harness-deepagents",
  "trellis-harness-openai-agents",
  "trellis-harness-claude-agent-sdk",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``trellis`` is a namespace package shared by every trellis-* distribution: no __init__.py.
packages = ["src/trellis"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "integrations/langgraph",
  "integrations/agui",
  "integrations/a2a",
  "integrations/deepagents",
  "integrations/openai_agents",
  "integrations/claude_agent_sdk",
]

[tool.uv.sources]
trellis-harness-langgraph = { workspace = true }
trellis-harness-agui = { workspace = true }
trellis-harness-deepagents = { workspace = true }
trellis-harness-openai-agents = { workspace = true }
trellis-harness-claude-agent-sdk = { workspace = true }
trellis-harness-a2a = { workspace = true }
# Local development against the Memory Service SDK checkout.
trellis-memory = { path = "../agent-memory-service/sdk/python", editable = true }
# The contract and the gateway client are separate distributions; local while unpublished.
trellis-contracts = { path = "../agent-contracts", editable = true }
bifrost-sdk = { path = "../bifrost-sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests",
  "integrations/langgraph/tests",
  "integrations/a2a/tests",
  "integrations/deepagents/tests",
  "integrations/openai_agents/tests",
  "integrations/claude_agent_sdk/tests",
]
timeout = 120
filterwarnings = ["error::DeprecationWarning:trellis.harness.*"]
markers = [
  "performance: harness overhead benchmarks",
  "compatibility: framework version compatibility matrix",
  "live: needs a running Memory Service (MEMORY_SERVICE_URL)",
  "live_llm: needs a Memory Service *and* a model gateway (BIFROST_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "src",
  "integrations/langgraph/src",
  "integrations/agui/src",
  "integrations/a2a/src",
  "integrations/deepagents/src",
  "integrations/openai_agents/src",
  "integrations/claude_agent_sdk/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC", "T20"]
ignore = ["PLR0913", "PLR2004", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "T20", "PLC0415", "E501"]
"integrations/*/tests/**" = ["PLR2004", "T20", "PLC0415", "E501"]
# E402: sys.path is set up before the imports. PLC0415: fixtures import optional
# dependencies *after* deciding to skip, so a missing service is a skip not an ImportError.
"conftest.py" = ["E402", "PLC0415"]
"examples/**" = ["T20"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = [
  "src",
  "integrations/langgraph/src",
  "integrations/agui/src",
  "integrations/a2a/src",
  "integrations/deepagents/src",
  "integrations/openai_agents/src",
  "integrations/claude_agent_sdk/src",
]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "standard"
reportMissingImports = "warning"

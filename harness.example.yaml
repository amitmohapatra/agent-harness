# Universal Agent Harness — the whole configuration surface (52 settings).
# Load with: AgentHarness(memory=..., config="harness.yaml")
# Every value shown is the default. Environment variables override the file.
#
# Two rules this file follows:
#   * one source of truth per concern — capture and sampling are defined once, under
#     `telemetry`, and every backend (including Langfuse) obeys them;
#   * no setting that only exists to agree with something else — a provider is enabled by
#     passing it to AgentHarness(...), not by a flag.

harness:
  memory:
    enabled: true
    retrieve_before: true          # fetch a context bundle before the agent runs
    observe_input: true            # write the turn's question back
    observe_output: true           # write the agent's answer back
    observe_claims: true           # write the agent's claims back
    record_outcome: true           # label the run success/failure for tool memory
    observe_tool_results: false    # tool outputs are NOT sent to memory by default
    private_by_default: false      # true -> everything written is RUN-visible only
    record_messages: false         # also record the turn as chat messages
    token_budget: null             # null -> the service's default bundle budget
    writeback: true                # write after the result is returned, not before
    failure_mode: non_blocking     # non_blocking | fail_closed

  telemetry:
    enabled: true
    service_name: agent-harness
    configure_sdk: false           # true only if your app does not configure OpenTelemetry
    exporter: none                 # none | console | otlp   (only with configure_sdk)
    endpoint: null
    metrics_enabled: true
    capture:                       # what may appear in telemetry — every backend obeys this
      inputs: false                # prompts, tool arguments, agent inputs
      outputs: false               # completions, tool results, agent results
      memory_content: false        # retrieved memory text (the most sensitive payload)
      user_id: false               # identity export is a policy decision
      thread_id: true              # an opaque id, not content
    sampling:
      sample_rate: 1.0
      error_sample_rate: 1.0       # keep every failure even at a low sample rate
      critical_agent_sample_rate: 1.0
      critical_agents: []

  observability:
    structured_logging: true
    log_level: INFO
    failure_mode: non_blocking     # applies to every telemetry backend
    langfuse:
      enabled: false
      mode: auto                   # auto | sdk | otlp
      base_url: null               # or LANGFUSE_HOST / LANGFUSE_BASE_URL
      public_key: null             # or LANGFUSE_PUBLIC_KEY
      secret_key: null             # or LANGFUSE_SECRET_KEY
      environment: null
      release: null

  models:
    default_model: null            # the client itself is passed to AgentHarness(model=...)

  tools:
    record_to_memory: true         # record invocations in the Memory Service tool memory
    use_memory_cache: false

  retries:
    enabled: false                 # opt-in, and only for agents marked idempotent=True
    max_attempts: 2
    backoff_seconds: 0.1           # exponential with jitter, capped at 30s
    retry_categories: [TIMEOUT, RATE_LIMIT, DEPENDENCY]

  timeouts:                        # a child call never outlives its parent
    default_seconds: 30.0
    memory_seconds: 10.0
    model_seconds: 60.0
    tool_seconds: 30.0

  artifacts:
    enabled: true
    inline_max_bytes: 64000        # larger result payloads become artifacts

  evaluation_events:
    enabled: false
    synchronous: false             # evaluation stays off the critical path
    sample_rate: 1.0

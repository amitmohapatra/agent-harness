[project]
name = "trellis-harness-temporal"
version = "0.1.0"
description = "Temporal adapters for trellis-harness: a workflow per run behind the RunStore port, Temporal Schedules behind the Scheduler port"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agent Platform Team" }]
dependencies = [
  "trellis-harness>=0.3",
  "trellis-contracts>=0.3",
  "temporalio>=1.33",
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.16", "pyright>=1.1.414"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repeated from the root pyproject: pytest picks *this* config when these tests are run on
# their own path, so an unregistered marker here would be a warning nobody asked for.
markers = [
  "temporal: needs temporalio's time-skipping test server (downloaded on first use)",
]

[project]
name = "trellis-harness-langgraph"
version = "0.2.0"
description = "LangGraph adapter for the trellis-harness. Never a core harness dependency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["trellis-harness>=0.2"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2"]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "langgraph>=1.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

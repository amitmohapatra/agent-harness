[project]
name = "universal-agent-harness-langgraph"
version = "0.1.0"
description = "LangGraph adapter for the Universal Agent Harness. Never a core harness dependency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["universal-agent-harness"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2"]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "langgraph>=1.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_agent_harness_langgraph"]

[tool.uv.sources]
universal-agent-harness = { workspace = true }

[project]
name = "trellis-harness-deepagents"
version = "0.1.0"
description = "Deep Agents adapter for the trellis-harness. Never a core harness dependency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["trellis-harness>=0.3"]

[project.optional-dependencies]
# The version range this adapter is tested against; see COMPATIBILITY.md.
deepagents = ["deepagents>=0.7.19,<0.8"]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "deepagents>=0.7.19,<0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

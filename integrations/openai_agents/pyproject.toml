[project]
name = "trellis-harness-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK adapter for the trellis-harness. Never a core harness dependency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["trellis-harness>=0.3"]

[project.optional-dependencies]
# The version range this adapter is tested against; see COMPATIBILITY.md.
openai-agents = ["openai-agents>=0.22.3,<0.23"]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "openai-agents>=0.22.3,<0.23"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

[project]
name = "trellis-harness-a2a"
version = "0.1.0"
description = "A2A surface and client for trellis-harness: serve any harness agent as an A2A agent, call registry agents as tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agent Platform Team" }]
dependencies = [
  "trellis-harness>=0.3",
  "trellis-contracts>=0.3",
  # Pinned to the version this repository verified against (A2A protocol v1.0, protobuf types).
  # The http-server extra brings starlette + sse-starlette, which the route builders need.
  "a2a-sdk[http-server]==1.1.5",
  "httpx>=0.28",
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.16", "pyright>=1.1.414"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "trellis-harness-agui"
version = "0.1.0"
description = "AG-UI surface for trellis-harness: one SSE route a UI drives, pauses, resumes and rates any agent through"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agent Platform Team" }]
dependencies = [
  "trellis-harness>=0.3",
  "trellis-contracts>=0.3",
  "fastapi>=0.115",
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.16", "pyright>=1.1.414"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.uv.sources]
trellis-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
